<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clubes de Judo de Bilbao</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;600;700;800&family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#0C1019;color:#F4EDE0;min-height:100vh}
.hd{text-align:center;padding:90px 24px 50px}.hd .jp{font-family:'Noto Serif JP',serif;font-size:54px;color:#C0392B;display:block;margin-bottom:14px}
.hd h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(38px,6vw,68px);letter-spacing:-.01em}.hd p{color:#9aa0b5;margin-top:14px;font-size:17px}
.grid{max-width:1100px;margin:0 auto;padding:0 24px 90px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:26px}
.club{display:block;background:#161C28;border:1px solid rgba(244,237,224,.1);border-radius:4px;overflow:hidden;transition:.25s;border-top:3px solid var(--a)}
.club:hover{transform:translateY(-6px);border-color:var(--a)}
.club-img{height:200px;background-size:cover;background-position:center;filter:saturate(.9)}
.club-body{padding:26px}.club-zona{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--a);font-weight:700}
.club-body h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px;margin:8px 0}.club-rating{color:#9aa0b5;font-size:14px;display:block}
.club-go{display:inline-block;margin-top:16px;color:#F4EDE0;font-weight:600;font-size:14px;letter-spacing:.04em}
footer{text-align:center;padding:30px;color:#5a6072;font-size:12px;border-top:1px solid rgba(244,237,224,.08)}</style></head>
<body><div class="hd"><span class="jp">柔道</span><h1>Clubes de Judo de Bilbao</h1><p>Escuelas de judo de la villa · webs de muestra</p></div>
<div class="grid">
    <a class="club" href="dojo-samurai/" style="--a:#1F6F8B">

    </a>

    </a>
</div><footer>柔道 · Bilbao</footer></body></html>
